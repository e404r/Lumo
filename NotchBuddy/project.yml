name: Lumo
options:
  bundleIdPrefix: com.lumo
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_ENTITLEMENTS: Resources/Lumo.entitlements

schemes:
  Lumo:
    build:
      targets:
        Lumo: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Lumo:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Lumo
        CFBundleDisplayName: Lumo
        CFBundleIdentifier: com.lumo.Lumo
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "To jump to terminal and integrate with editor."
        NSAccessibilityUsageDescription: "To read window titles and assist with context."
        NSMicrophoneUsageDescription: "Lumo uses your microphone for hands-free voice commands and dictation."
        NSSpeechRecognitionUsageDescription: "Lumo uses speech recognition to convert your voice into AI coding prompts."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumo.Lumo
        PRODUCT_NAME: Lumo
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
